<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cursor-settings-panel">
        <h1>Cursor Sets</h1>
        <p class="panel-desc">Choose your preferred pointer set from the options below.</p>

        <div class="form-group">
            <label for="cursor-set-select">Cursor set</label>
            <select id="cursor-set-select">
                <option value="system">System Pointer Set</option>
                <option value="minimal">Minimalist</option>
                <option value="gaming">Gaming Neon</option>
            </select>
        </div>

        <div class="preview-label">Preview</div>
        <div class="preview-area" id="preview-area">
            <button class="cursor-type" data-type="normal">Normal</button>
            <button class="cursor-type" data-type="pointer">Pointer</button>
            <button class="cursor-type" data-type="text">Text</button>
            <button class="cursor-type" data-type="crosshair">Crosshair</button>
            <button class="cursor-type" data-type="wait">Wait</button>
            <button class="cursor-type" data-type="busy">Busy</button>
            <button class="cursor-type" data-type="help">Help</button>
            <button class="cursor-type" data-type="not-allowed">Not Allowed</button>
        </div>

        <div class="status-label" id="status-label">Normal</div>

        <div class="actions">
            <button id="confirm-btn" class="primary-btn">Confirm Cursor Set</button>
            <span id="applied-status" class="applied-status">Applied: System Pointer Set</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
