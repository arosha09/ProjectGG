<section class="auth-shell">
    <header class="homebar">
      <div class="home-brand" routerLink="/home">
        <img loading="lazy" decoding="async" src="logo.ico" alt="Project GG Logo" class="brand-logo" />
        <span>PROJECT GG</span>
      </div>
      <nav class="home-links">
        <a routerLink="/login">Login</a>
      </nav>
    </header>
  <div class="auth-grid"></div>
  <div class="ambient-glow"></div>

  <div class="auth-card card fade-in-up">
    <div class="auth-header">
      <p class="eyebrow">Create account</p>
    </div>
    <h1>Forge your gamer identity</h1>
    <p class="lede">Register to unlock your dashboard and keep your collection in sync.</p>

    <form class="auth-form" (ngSubmit)="submit()">
      <label>
        <span>Display name</span>
        <input
          [(ngModel)]="name"
          name="name"
          type="text"
          placeholder="Nova Runner"
          [disabled]="loading"
        />
      </label>

      <label>
        <span>Gamertag</span>
        <input
          [(ngModel)]="username"
          name="username"
          type="text"
          placeholder="nova_runner"
          [disabled]="loading"
        />
      </label>

      <label>
        <span>Email</span>
        <input
          [(ngModel)]="email"
          name="email"
          type="email"
          placeholder="pilot@projectgg.io"
          [disabled]="loading"
        />
      </label>

      <label>
        <span>Date of Birth</span>
        <app-cyber-date-picker
          [value]="dateOfBirth"
          placeholder="MM/DD/YYYY"
          [disabled]="loading"
          iconColor="#aa44ff"
          (valueChange)="dateOfBirth = $event"
        ></app-cyber-date-picker>
      </label>

      <label>
        <span>Gender</span>
        <app-cyber-select
          [options]="genderOptions"
          [value]="gender"
          placeholder="Select gender"
          [disabled]="loading"
          (valueChange)="gender = $event"
        ></app-cyber-select>
      </label>

      <label class="password-label">
        <span>Password</span>
        <div class="password-input-wrapper">
          <input
            [(ngModel)]="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Create a secure password"
            [disabled]="loading"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            tabindex="-1"
            [disabled]="loading"
          >
            <mat-icon class="eye-icon">{{ showPassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
        </div>
      </label>

      <label class="password-label">
        <span>Confirm password</span>
        <div class="password-input-wrapper">
          <input
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            placeholder="Repeat password"
            [disabled]="loading"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="toggleConfirmPassword()"
            tabindex="-1"
            [disabled]="loading"
          >
            <mat-icon class="eye-icon">{{ showPassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
        </div>
      </label>

      <button class="btn btn-large btn-glow" type="submit" [disabled]="loading">
        <span class="btn-content">
          <span class="btn-spinner" [class.active]="loading"></span>
          {{ loading ? 'BUILDING PROFILE...' : 'JOIN PROJECT GG' }}
        </span>
      </button>
    </form>

    @if (successMessage) {
      <app-status-message type="success" [message]="successMessage" />
    }
    <app-status-message *ngIf="error" type="error" [message]="error" />

    <p class="switch-link">
      Already connected?
      <a routerLink="/login">Login now</a>
    </p>
  </div>
</section>
