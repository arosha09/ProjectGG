@if (isOpen) {
  <div class="cyber-menu">
    @for (item of items; track item.label) {
      @if (!item.adminOnly || isAdmin) {
        @if (item.link) {
          <a class="cyber-menu-item" [routerLink]="item.link" (click)="itemSelect.emit(item)">
            @if (item.icon) { <mat-icon>{{item.icon}}</mat-icon> }
            {{ item.label }}
          </a>
        } @else {
          <button class="cyber-menu-item" type="button" (click)="selectItem(item)">
            @if (item.icon) { <mat-icon>{{item.icon}}</mat-icon> }
            {{ item.label }}
          </button>
        }
      }
    }
  </div>
}
