<header class="dashbar">
  <div class="brand" routerLink="/dashboard">
    <img src="logo.ico" alt="ProjectGG" class="brand-mark" />
    <span>PROJECT GG</span>
  </div>

  <div class="dash-actions">
    <app-theme-selector
      [currentTheme]="currentTheme()"
      [isOpen]="themeDropdownOpen()"
      (themeChange)="themeChange.emit($event)"
      (toggle)="themeToggle.emit()"
    ></app-theme-selector>

    <app-status-selector
      [currentStatus]="currentStatus()"
      [isOpen]="statusDropdownOpen()"
      (statusChange)="statusChange.emit($event)"
      (toggle)="statusToggle.emit()"
    ></app-status-selector>

    <a class="nav-discord-btn" routerLink="/chat" title="Discord Chat">
      <img src="https://cdn.simpleicons.org/discord/ffffff" alt="Discord" class="nav-discord-icon" />
      <span>Discord</span>
    </a>

    <div class="profile-trigger" *ngIf="userName()" (click)="profileToggle.emit()">
      <img class="user-avatar" [src]="displayAvatar()" alt="Avatar" (error)="handleAvatarError()" />
      <span class="user-name">{{ userName() }}</span>
      <span class="trigger-arrow">▼</span>
    </div>

    <app-cyber-dropdown
      [items]="profileItems"
      [isOpen]="profileDropdownOpen()"
      [isAdmin]="isAdmin()"
    ></app-cyber-dropdown>
  </div>
  <button class="hamburger" (click)="toggleMobileMenu()" [class.active]="mobileMenuOpen">
    <span></span><span></span><span></span>
  </button>
</header>

<div class="mobile-menu" [class.open]="mobileMenuOpen">
  <app-theme-selector
    [currentTheme]="currentTheme()"
    [isOpen]="themeDropdownOpen()"
    (themeChange)="themeChange.emit($event); mobileMenuOpen = false"
    (toggle)="themeToggle.emit()"
  ></app-theme-selector>

  <app-status-selector
    [currentStatus]="currentStatus()"
    [isOpen]="statusDropdownOpen()"
    (statusChange)="statusChange.emit($event); mobileMenuOpen = false"
    (toggle)="statusToggle.emit()"
  ></app-status-selector>

  <div class="profile-trigger" *ngIf="userName()" (click)="profileToggle.emit(); mobileMenuOpen = false">
    <img class="user-avatar" [src]="displayAvatar()" alt="Avatar" (error)="handleAvatarError()" />
    <span class="user-name">{{ userName() }}</span>
    <span class="trigger-arrow">▼</span>
  </div>

  <app-cyber-dropdown
    [items]="profileItems"
    [isOpen]="profileDropdownOpen()"
    [isAdmin]="isAdmin()"
  ></app-cyber-dropdown>
</div>
