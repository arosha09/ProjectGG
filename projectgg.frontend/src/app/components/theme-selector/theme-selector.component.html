<div class="theme-dropdown" [class.open]="isOpen()">
	<button type="button" class="theme-toggle" (click)="toggle.emit()">
		<span class="theme-color-dot" [style.background-color]="getColor(currentTheme())"></span>
		<span class="theme-label">{{ currentTheme() === 'custom' ? 'Custom' : (currentTheme() | titlecase) }}</span>
		<span class="theme-arrow">▼</span>
	</button>
	<div class="theme-menu">
		@for (t of themes; track t.key) {
			<button type="button" class="theme-option" [class.active]="currentTheme() === t.key" (click)="select(t.key)">
				@if (t.key === 'custom') {
					<span class="option-custom-wrap">
						<input type="color" class="option-color-picker" [value]="customColor()" (input)="onColorInput($event); select('custom')" />
						<span class="option-dot custom-dot" [style.background]="customColor()"></span>
					</span>
				} @else {
					<span class="option-dot" [style.background]="t.color"></span>
				}
				<span>{{ t.key === 'custom' ? 'Custom Color' : (t.key | titlecase) }}</span>
				@if (t.key === 'custom' && currentTheme() === 'custom') {
					<span class="option-check">✓</span>
				}
			</button>
		}
	</div>
</div>
